<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Task Manager</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-item>
    <ion-input 
      [(ngModel)]="newTask" 
      placeholder="Enter a task">
    </ion-input>
  </ion-item>

  <ion-button expand="full" (click)="addTask()">
    Add Task
  </ion-button>

  <ion-list>
    <ion-item *ngFor="let task of tasks">
      {{ task }}
    </ion-item>
  </ion-list>

</ion-content>
