<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Task Manager</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-item>
    <ion-input 
      [(ngModel)]="newTask" 
      placeholder="Enter a task">
    </ion-input>
  </ion-item>

  <ion-button expand="full" (click)="addTask()">
    Add Task
  </ion-button>

  <ion-list>
    <ion-item *ngFor="let task of tasks; let i = index">

      <ion-checkbox 
        slot="start" 
        [(ngModel)]="task.done">
      </ion-checkbox>

      <span [ngClass]="{ 'completed': task.done }">
        {{ task.text }}
      </span>

      <ion-button slot="end" color="danger" (click)="deleteTask(i)">
        Delete
      </ion-button>

    </ion-item>
  </ion-list>

</ion-content>
